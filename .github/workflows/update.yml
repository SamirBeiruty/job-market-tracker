name: Daily update

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - run: python -m src.run

      - name: Commit updated data
        run: |
          git config user.name "SamirBeiruty"
          git config user.email "samir.albeiruty@gmail.com"
          git add data reports README.md
          git diff --cached --quiet || git commit -m "Daily data update"
          git push
